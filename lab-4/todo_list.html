<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Список дел</title>

    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="todo-page">

    <nav>
        <a href="index.html">Все задания</a>
        <a href="welcome.html">Текст</a>
        <a href="signs.html">Знаки</a>
        <a href="404_page.html">Страница 404</a>
        <a href="todo_list.html">Список дел</a>
    </nav>

    <main>
        <small>Задание 4 · учебный план</small>

        <h1>Список дел</h1>

        <p>Один небольшой шаг к выполненной работе.</p>

        <div class="container">
            <form id="newtask">
                <label for="task-input">Новая задача</label>

                <div class="input-row">
                    <input
                        id="task-input"
                        type="text"
                        placeholder="Введите описание задачи"
                        maxlength="300"
                        autocomplete="off"
                    >

                    <button
                        id="push"
                        type="submit"
                        aria-label="Добавить задачу"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            width="24"
                            height="24"
                            aria-hidden="true"
                        >
                            <path
                                d="M12 5v14M5 12h14"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                            />
                        </svg>
                    </button>
                </div>
            </form>

            <p id="message" role="status" aria-live="polite"></p>

            <div id="tasks" aria-label="Задачи"></div>
        </div>

        <noscript>
            Для добавления и удаления задач включите JavaScript.
        </noscript>
    </main>

    <script src="js/todo.js"></script>

</body>
</html>
